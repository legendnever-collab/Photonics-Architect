name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: photonics-architect-offline
          path: dist/*v0.8.0*.html
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v080-browser-evidence
          path: |
            artifacts/v080-qa/
            docs/v080-*.png
