name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.4.1.html && cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.5.0.html && cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.5.1.html
      - uses: actions/upload-artifact@v4
        with:
          name: photonics-architect-offline
          path: dist/photonics-architect-v0.6.0.html
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.4.1.html && cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.5.0.html && cp dist/photonics-architect-v0.6.0.html dist/photonics-architect-v0.5.1.html
      - run: node tests/browser.cjs && node tests/codesign-browser.cjs && node tests/levels-browser.cjs && node tests/routing-browser.cjs && node tests/mobile-browser.cjs && node tests/touch-routing-browser.cjs && node tests/scaling-browser.cjs && node tests/solutions-browser.cjs && node tests/package-browser.cjs && node tests/flow-visualization-browser.cjs && node tests/wdm-browser.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
